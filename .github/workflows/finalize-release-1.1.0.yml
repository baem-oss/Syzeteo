name: finalize-release-1.1.0

on:
  push:
    branches:
      - release-1.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-1.1.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize application version and navigation
        run: python tools/finalize_release_1_1_0.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m unittest discover -v

      - name: Commit generated release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py test_navigation.py
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Syzeteo 1.1.0 runtime"
            git push origin HEAD:release-1.1.0
          fi
